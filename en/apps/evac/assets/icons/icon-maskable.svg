<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Maskable variant: full-bleed square background, no baked-in corner
       radius. The OS applies its own mask shape (circle/squircle/rounded
       square) on top - if we round the corners ourselves too, the OS mask
       can reveal unfilled gaps outside our rounding. Glyph stays identical
       and already sits inside the ~80% safe-zone circle. -->
  <rect width="512" height="512" fill="#2f6f5e"/>
  <g fill="#ffffff">
    <rect x="196" y="120" width="120" height="46" rx="20"/>
    <path d="M156 190 h200 a36 36 0 0 1 36 36 v170 a48 48 0 0 1 -48 48 h-176 a48 48 0 0 1 -48 -48 v-170 a36 36 0 0 1 36 -36 z"/>
    <rect x="156" y="190" width="200" height="60" rx="14" fill="#2f6f5e"/>
    <rect x="176" y="270" width="160" height="130" rx="16" fill="#2f6f5e"/>
    <circle cx="256" cy="335" r="10" fill="#ffffff"/>
  </g>
</svg>
