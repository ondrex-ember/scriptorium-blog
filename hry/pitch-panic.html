{id:"taxi",ico:"🚕",title:"Taxi",desc:"Drahé. Ale řidič chce konverzaci a ty nemáš na výběr.",tag:"−0 min  •  nucený elevator pitch",events:[{roll:0.4,txt:'"Takže, co děláte?" Vysvětluješ. Řidič: "To je jako Uber, ale pro..." — Ano. Přesně. Ale jinak.',fx:{qualBonus:"solution",q:16,focus:12},log:"Taxi pitch: solution +16, focus +12"},{roll:0.3,txt:'"Můj syn dělá taky startup." Řidič ti dá číslo na svého syna. Seed investor? Nebo jen pyšný táta?',fx:{focus:10,stress:-8},log:"Taxi networking: focus +10, stress −8"},{roll:0.3,txt:"Řidič hraje české rádio. Cesta trvá 22 minut. Nemyslíš na nic. Je to skvělé.",fx:{stress:-18,focus:14},log:"Taxi detox: stress −18, focus +14"}]},
{id:"walk",ico:"🚶",title:"Pěšky",desc:"Zdarma. Počasí nerozhoduje za tebe, ale rozhoduje o tobě.",tag:"−15 hern. min  •  počasí random",events:[{roll:0.33,txt:"Sluníčko, čerstvý vzduch. Mozek se probral. Proč sedíš doma každý den?",fx:{stress:-20,focus:22,gMin:15},log:"Krásné počasí: stress −20, focus +22 (−15 min)"},{roll:0.33,txt:"Liják. Přijdeš mokrý. Boris uvidí, že jsi šel pěšky. Neuvidí. Ale ty to víš.",fx:{stress:18,focus:-8,gMin:15},log:"Déšť: stress +18, focus −8 (−15 min)"},{roll:0.34,txt:"Potká tě bývalý kolega z korporátu. 'Stále ten startup?' Přikývneš. Trochu zrychleně.",fx:{stress:6,focus:5,gMin:15},log:"Awkward meeting: stress +6, focus +5 (−15 min)"}]}
];
const BORIS_QS=[
{txt:'"Tak. [NAME]. Proč to vůbec dělat? Proč bych já, jako člověk který investoval do 40 startupů a z toho 38 zkrachovalo, měl věřit, že tento problém existuje a stojí za řešení?"',sec:"problem",ans:[{lbl:"Citovat konkrétní data + uživatelský výzkum",score:30,rxn:"Boris přikývl. Pomalu. Ale přikývl. To je maximum."},{lbl:'Osobní příběh: "Sám jsem tento problém zažil..."',score:16,rxn:'"Hezký příběh. Ale to není pitch." Zapsal si poznámku.'},{lbl:'"Lidi to prostě potřebují, víte..."',score:5,rxn:'Boris si zapsal jedno slovo. Pravděpodobně "slabé".'}]},
{txt:'"Trh. Jak velký. Číslo. Teď. A nepovídejte mi o miliardách bez metodologie, to dělají junioři."',sec:"market",ans:[{lbl:"TAM/SAM/SOM s konkrétní metodologií a zdroji",score:30,rxn:'"Hmm." Toto je nejvyšší kompliment, jaký Boris dává.'},{lbl:"Konzervativní odhad dolů s vysvětlením logiky",score:19,rxn:'"Konzervatismus. Trochu to cením."'},{lbl:'"Trh je obrovský, určitě miliardy..."',score:3,rxn:"Boris zavřel notebook. Velmi špatné znamení."}]},
{txt:'"Proč ne existující řešení? V čem jste jiní, kromě toho, že jste přišli o rok a půl později a máte méně peněz?"',sec:"competition",ans:[{lbl:"Konkrétní differenciace + unfair advantage + proč teď",score:30,rxn:"Boris se téměř usmál. Téměř. Historický moment."},{lbl:"Pivot story — proč vám konkurence paradoxně pomohla",score:20,rxn:'"Zajímavý frame. Uvidíme v termsheet."'},{lbl:'"Naše UX je prostě lepší."',score:4,rxn:'"UX." Opakoval slovo s neskrývaným despektem.'}]}
];
const SECS=["problem","solution","market","competition"];
const SN={problem:"Problem & Pain",solution:"Naše řešení",market:"Velikost trhu",competition:"Konkurence"};
let S={phase:"idea",idea:null,doc:{problem:{p:0,q:0},solution:{p:0,q:0},market:{p:0,q:0},competition:{p:0,q:0}},focus:80,stress:15,gMin:0,selSec:"problem",log:[],event:null,pitch:{qi:0,score:0,log:[],handicap:0},coffees:0,eCnt:{},timerRef:null,wCd:0,lastEvMin:-999};
function cl(v,a,b){return Math.max(a,Math.min(b,v));}
function cs(m){let h=Math.floor(m/60)+8,mn=m%60;return String(h).padStart(2,"0")+":"+String(mn).padStart(2,"0");}
function pct(v){return Math.round(cl(v,0,100));}
function bar(v,cls,h){return`<div class="bar${h===5?" ":""}" style="height:${h||8}px"><div class="bi ${cls}" style="width:${pct(v)}%;height:100%;"></div></div>`;}
function addLog(txt,cls){S.log.unshift({txt,cls});if(S.log.length>25)S.log.pop();}
function docP(){let t=0;SECS.forEach(s=>t+=S.doc[s].p);return t/4;}
function docQ(){let t=0;SECS.forEach(s=>t+=S.doc[s].q);return t/4;}
function applyFx(fx){
  if(fx.focus!==undefined)S.focus=cl(S.focus+fx.focus,0,100);
  if(fx.stress!==undefined)S.stress=cl(S.stress+fx.stress,0,100);
  if(fx.gMin!==undefined)S.gMin=Math.min(S.gMin+fx.gMin,480);
  let sec=fx.secBonus==="active"?S.selSec:fx.secBonus;
  if(sec&&S.doc[sec]){S.doc[sec].p=cl(S.doc[sec].p+(fx.bonus||0),0,100);S.doc[sec].q=cl(S.doc[sec].q+(fx.qualBonus||0),0,100);}
  if(fx.qualBonus&&!fx.secBonus){S.doc[S.selSec].q=cl(S.doc[S.selSec].q+fx.qualBonus,0,100);}
  if(fx.secPenalty==="all")SECS.forEach(s=>{S.doc[s].p=cl(S.doc[s].p-(fx.penalty||0),0,100);});
}
function trySpawnEvent(){
  if(S.event)return;
  let cd=S.gMin>240?70:90;
  if(S.gMin-S.lastEvMin<cd)return;
  let eligible=EVENTS.filter(e=>{
    if(e.minG!==undefined&&S.gMin<e.minG)return false;
    if(e.maxG!==undefined&&S.gMin>e.maxG)return false;
    let cnt=S.eCnt[e.id]||0;
    if(e.rep)return cnt<(e.maxFires||3);
    return cnt===0;
  });
  if(!eligible.length)return;
  let totalW=eligible.reduce((s,e)=>s+e.w,0);
  if(Math.random()*totalW>totalW*0.45)return;
  let r=Math.random()*totalW,acc=0,sel=eligible[eligible.length-1];
  for(let e of eligible){acc+=e.w;if(r<=acc){sel=e;break;}}
  S.event=sel;S.eCnt[sel.id]=(S.eCnt[sel.id]||0)+1;S.lastEvMin=S.gMin;
  render();
}
function tick(){
  if(S.phase!=="home")return;
  S.gMin=Math.min(S.gMin+3,480);
  if(S.wCd>0)S.wCd=Math.max(0,S.wCd-3);
  let aft=S.gMin>240;
  S.stress=cl(S.stress+(aft?0.28:0.13),0,100);
  S.focus=cl(S.focus-(aft?0.14:0.07),0,100);
  trySpawnEvent();
  if(S.gMin>=480&&!S.event){startTransit();return;}
  updateHUD();if(!S.event)updateHomePartial();
}
function startDay(){
  S.phase="home";S.gMin=0;S.focus=80;S.stress=15;S.wCd=0;
  S.log=[];S.eCnt={};S.lastEvMin=-999;
  addLog("Den začíná. Šéfe, ty to zvládneš.","info");
  document.getElementById("pp-phase-lbl").textContent="HOME PHASE";
  S.timerRef=setInterval(tick,1000);render();
}
function workOnSection(){
  if(S.wCd>0||S.phase!=="home")return;
  let sec=S.selSec,fm=S.focus/100;
  let gain=Math.max(2,13*fm*(1-S.doc[sec].p/120));
  let qg=Math.max(1,5*fm);
  S.doc[sec].p=cl(S.doc[sec].p+gain,0,100);S.doc[sec].q=cl(S.doc[sec].q+qg,0,100);
  S.stress=cl(S.stress+2.5,0,100);S.focus=cl(S.focus-1.5,0,100);S.wCd=30;
  addLog(`[${SN[sec]}] +${Math.round(gain)}% progress`,"ok");
  if(S.doc[sec].p>=100)addLog(`✓ ${SN[sec]} dokončeno!`,"ok");
  render();
}
function drinkCoffee(){
  S.coffees++;
  if(S.coffees<=3){S.focus=cl(S.focus+22,0,100);S.stress=cl(S.stress-8,0,100);addLog("☕ Kafe #"+S.coffees+" vypito. Mozek se probral.","ok");}
  else{S.focus=cl(S.focus+5,0,100);S.stress=cl(S.stress+16,0,100);addLog("☕ Kafe #"+S.coffees+". Srdce klepe podezřele.","warn");}
  render();
}
function doResearch(){
  if(S.wCd>0)return;
  let sec=S.selSec;
  S.doc[sec].q=cl(S.doc[sec].q+17,0,100);S.doc[sec].p=cl(S.doc[sec].p+4,0,100);
  S.focus=cl(S.focus-6,0,100);S.wCd=45;
  addLog(`📚 Research: ${SN[sec]} quality +17`,"info");render();
}
function checkPhone(){
  S.stress=cl(S.stress+4,0,100);addLog("📱 Twitter. LinkedIn. Nic důležitého. (lže)","warn");
  if(!S.event&&Math.random()<0.65){
    let rep=EVENTS.filter(e=>e.rep&&(S.eCnt[e.id]||0)<(e.maxFires||3));
    if(rep.length){S.event=rep[Math.floor(Math.random()*rep.length)];S.eCnt[S.event.id]=(S.eCnt[S.event.id]||0)+1;}
  }
  render();
}
function resolveEvent(idx){
  let o=S.event.outcomes[idx];
  applyFx(o.fx||{});addLog("→ "+o.txt,"info");S.event=null;render();
}
function startTransit(){
  clearInterval(S.timerRef);S.phase="transit";
  document.getElementById("pp-phase-lbl").textContent="TRANSIT";render();
}
function chooseTransit(idx){
  let tr=TRANSIT[idx];
  let roll=Math.random(),acc=0,outcome=tr.events[tr.events.length-1];
  for(let e of tr.events){acc+=e.roll;if(roll<=acc){outcome=e;break;}}
  if(outcome.fx){
    if(outcome.fx.focus!==undefined)S.focus=cl(S.focus+outcome.fx.focus,0,100);
    if(outcome.fx.stress!==undefined)S.stress=cl(S.stress+outcome.fx.stress,0,100);
    if(outcome.fx.gMin!==undefined)S.gMin=Math.min(S.gMin+outcome.fx.gMin,480);
    if(outcome.fx.qualBonus){let s=outcome.fx.qualBonus;if(S.doc[s])S.doc[s].q=cl(S.doc[s].q+outcome.fx.q,0,100);}
  }
  addLog("🚌 Transit: "+outcome.log,"info");
  S.pitch.handicap=S.stress>70?Math.round((S.stress-70)*0.4):0;
  S.phase="pitch";document.getElementById("pp-phase-lbl").textContent="PITCH PHASE";render();
}
function answerBoris(idx){
  let qi=S.pitch.qi,q=BORIS_QS[qi],a=q.ans[idx];
  let qMod=S.doc[q.sec].q/100;
  let bonus=Math.round(a.score*cl(0.45+qMod*0.8,0.45,1.2));
  S.pitch.score+=bonus;S.pitch.log.push({rxn:a.rxn,bonus});S.pitch.qi++;
  if(S.pitch.qi>=BORIS_QS.length){S.phase="result";document.getElementById("pp-phase-lbl").textContent="VÝSLEDEK";}
  render();
}
function finalScore(){
  let dp=docP(),dq=docQ(),pp=S.pitch.score,h=S.pitch.handicap;
  let docPts=Math.round((dp*0.35+dq*0.65)*0.45);
  return cl(pp+docPts-h,0,100);
}
function verdict(sc){
  if(sc>=80)return{e:"🚀",t:"Boris byl překvapen — i když to nedal najevo. Termsheet přichází. Možná. Ale přichází.",c:"#27ae60"};
  if(sc>=60)return{e:"😅",t:"Solidní pitch. Základy tam jsou. Boris si tě zapamatoval jako 'ten s potenciálem'.",c:"#2980b9"};
  if(sc>=40)return{e:"🤕",t:"Přežil jsi. Prezentace nebyla katastrofa — jen nezapomenutelná ze špatných důvodů.",c:"#e67e22"};
  return{e:"💀",t:"Boris si sbalil věci uprostřed prezentace. Odcházel, aniž by se otočil. Existuje horší feedback. Ale ne mnoho.",c:"#c0392b"};
}
function updateHUD(){let c=document.getElementById("pp-clock");if(c)c.textContent=cs(S.gMin);}
function updateHomePartial(){
  let tf=document.getElementById("tf"),ts=document.getElementById("ts"),tp=document.getElementById("tp");
  if(tf)tf.style.width=pct(S.focus)+"%";
  if(ts)ts.style.width=pct(S.stress)+"%";
  if(tp){let aft=S.gMin>240;tp.style.width=pct(S.gMin/480*100)+"%";tp.style.background=aft?"#c0392b":"#e67e22";}
  let wb=document.getElementById("work-btn");if(wb)wb.disabled=S.wCd>0;
  let rb=document.getElementById("res-btn");if(rb)rb.disabled=S.wCd>0;
  SECS.forEach(s=>{
    let pb=document.getElementById("pb-"+s),qb=document.getElementById("qb-"+s);
    if(pb)pb.style.width=pct(S.doc[s].p)+"%";if(qb)qb.style.width=pct(S.doc[s].q)+"%";
  });
  let la=document.getElementById("log-area");
  if(la)la.innerHTML=S.log.slice(0,7).map(l=>`<div class="log-line ${l.cls||""}">${l.txt}</div>`).join("");
}
function render(){
  let c=document.getElementById("pp-content");if(!c)return;
  document.getElementById("pp-clock").textContent=cs(S.gMin);
  if(S.phase==="idea")c.innerHTML=renderIdea();
  else if(S.phase==="home")c.innerHTML=renderHome();
  else if(S.phase==="transit")c.innerHTML=renderTransit();
  else if(S.phase==="pitch")c.innerHTML=renderPitch();
  else if(S.phase==="result")c.innerHTML=renderResult();
  let ov=document.querySelector(".ev-overlay");if(ov)ov.remove();
  if(S.event&&S.phase==="home"){
    let d=document.createElement("div");d.className="ev-overlay";d.innerHTML=renderEvent();
    document.getElementById("pp").appendChild(d);
  }
}

</div>
<button class="btn g" style="width:100%;padding:11px;" onclick="startDay()">▶  ZAČÍT DEN</button>

  let aft=S.gMin>240,tp=S.gMin/480*100;
  return`<div class="ani">

<div>
  <div class="sec-hdr"><span class="section-lbl">STŮL</span>${S.wCd>0?`<span style="font-size:10px;color:#e67e22">CD ${S.wCd}min</span>`:""}</div>

  </div>

  <div class="doc-sections">
    ${SECS.map(s=>`<div class="dsec ${S.selSec===s?"active":""}" onclick="S.selSec='${s}';render()">
      <div class="dsec-h"><span class="dsec-n">${SN[s]}</span><span class="dsec-pct">P:${pct(S.doc[s].p)}% Q:${pct(S.doc[s].q)}%</span></div>
      <div style="height:5px;background:#1a1a2e;border-radius:1px;overflow:hidden;"><div class="bi bd" id="pb-${s}" style="width:${pct(S.doc[s].p)}%;height:5px;"></div></div>
      <div style="height:3px;background:#1a1a2e;border-radius:1px;overflow:hidden;margin-top:2px;"><div class="bi bq" id="qb-${s}" style="width:${pct(S.doc[s].q)}%;height:3px;"></div></div>

</div>
</div></div>`;}

  </div>
  ${S.stress>70?`<div style="font-size:11px;color:#c0392b;margin-top:4px;">⚠ Vysoký stres ovlivní výkon u Borise (−${Math.round((S.stress-70)*0.4)} bodů)</div>`:""}

<div class="section-lbl">JAK SE DOSTANEŠ NA PITCH?</div>
${TRANSIT.map((t,i)=>`<div class="tr-card" onclick="chooseTransit(${i})">

function renderPitch(){
  let qi=S.pitch.qi;
  if(qi>=BORIS_QS.length)return"";
  let q=BORIS_QS[qi],prev=S.pitch.log.slice(-1)[0];
  return`<div class="ani" style="max-width:500px;margin:0 auto;">
<div style="font-size:10px;color:#778;letter-spacing:2px;margin-bottom:8px;">OTÁZKA ${qi+1} / ${BORIS_QS.length}  •  Skóre: ${S.pitch.score} bodů</div>
${prev?`<div class="card" style="margin-bottom:10px;border-color:#27ae60;font-size:11px;"><span style="color:#27ae60">→</span> ${prev.rxn} <span style="color:#27ae60;float:right">+${prev.bonus}</span></div>`:""}
${S.pitch.handicap>0?`<div style="font-size:11px;color:#e67e22;margin-bottom:8px;">⚠ Stres handicap: −${S.pitch.handicap} bodů z finálního skóre</div>`:""}
<div class="stk-wrap">
  <div><div class="stk-av">🧔</div><div style="font-size:10px;color:#c0392b;letter-spacing:1px;text-align:center;margin-top:3px;">BORIS</div></div>
  <div class="stk-bub">${q.txt.replace("[NAME]",S.idea.name)}</div>
</div>
<div class="section-lbl">Sekce [${SN[q.sec]}] — quality: ${pct(S.doc[q.sec].q)}% → ovlivňuje sílu odpovědi</div>
${q.ans.map((a,i)=>`<button class="ans-btn" onclick="answerBoris(${i})">${a.lbl}</button>`).join("")}
</div>`;}
function renderResult(){
  let sc=finalScore(),v=verdict(sc);
  return`<div class="ani" style="max-width:460px;margin:0 auto;">
<div class="res-score"><span class="res-num" style="color:${v.c}">${sc}</span><span class="res-label">/ 100 bodů</span></div>
<div style="text-align:center;font-size:26px;margin-bottom:7px;">${v.e}</div>
<div class="verdict">${v.t}</div>
<div class="res-grid">
  <div class="res-item"><div class="res-rlbl">PITCH SCORE</div><div class="res-rval" style="color:#2980b9">${S.pitch.score}</div></div>
  <div class="res-item"><div class="res-rlbl">DOC PROGRESS</div><div class="res-rval" style="color:#27ae60">${pct(docP())}%</div></div>
  <div class="res-item"><div class="res-rlbl">DOC QUALITY</div><div class="res-rval" style="color:#e67e22">${pct(docQ())}%</div></div>
  <div class="res-item"><div class="res-rlbl">STRESS HANDICAP</div><div class="res-rval" style="color:#c0392b">−${S.pitch.handicap}</div></div>
</div>
${S.pitch.log.length?`<div class="section-lbl" style="margin-top:6px;">BORISOVY REAKCE</div>${S.pitch.log.map((l,i)=>`<div class="card" style="margin-bottom:5px;font-size:11px;padding:7px 10px;"><span style="color:#778">Q${i+1}:</span> ${l.rxn}<span style="color:#27ae60;float:right">+${l.bonus}</span></div>`).join("")}`:""}
<button class="btn g" style="width:100%;padding:11px;margin-top:10px;" onclick="restartGame()">↩ HRÁT ZNOVU (nová idea)</button>
</div>`;}
function restartGame(){
  clearInterval(S.timerRef);
  S={phase:"idea",idea:null,doc:{problem:{p:0,q:0},solution:{p:0,q:0},market:{p:0,q:0},competition:{p:0,q:0}},focus:80,stress:15,gMin:0,selSec:"problem",log:[],event:null,pitch:{qi:0,score:0,log:[],handicap:0},coffees:0,eCnt:{},timerRef:null,wCd:0,lastEvMin:-999};
  document.getElementById("pp-phase-lbl").textContent="IDEA DELIVERY";
  pickIdea();render();
}
function pickIdea(){S.idea=IDEAS[Math.floor(Math.random()*IDEAS.length)];}
pickIdea();render();
</script>
</body>
