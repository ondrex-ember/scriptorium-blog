// ── HELPERS ─────────────────────────────────────────────────────────────────
function cl(v,a,b){return Math.max(a,Math.min(b,v));}
function cs(m){let h=Math.floor(m/60)+8,mn=m%60;return String(h).padStart(2,"0")+":"+String(mn).padStart(2,"0");}
function pct(v){return Math.round(cl(v,0,100));}
function bar(v,cls,h){return`<div class="bar" style="height:${h||8}px"><div class="bi ${cls}" style="width:${pct(v)}%;height:100%;"></div></div>`;}
function addLog(txt,cls){S.log.unshift({txt,cls});if(S.log.length>30)S.log.pop();}
function docP(){let t=0;SECS.forEach(s=>t+=S.doc[s].p);return t/4;}
function docQ(){let t=0;SECS.forEach(s=>t+=S.doc[s].q);return t/4;}

function applyFx(fx){
  if(fx.focus!==undefined)S.focus=cl(S.focus+fx.focus,0,100);
  if(fx.stress!==undefined)S.stress=cl(S.stress+fx.stress,0,100);
  if(fx.gMin!==undefined)S.gMin=Math.min(S.gMin+fx.gMin,480);
  if(fx.cigs!==undefined)S.cigs+=fx.cigs;
  let sec=fx.secBonus==="active"?S.selSec:fx.secBonus;
  if(sec&&S.doc[sec]){
    S.doc[sec].p=cl(S.doc[sec].p+(fx.bonus||0),0,100);
    S.doc[sec].q=cl(S.doc[sec].q+(fx.qualBonus||0),0,100);
  }
  if(fx.qualBonus&&fx.qualBonus!==undefined&&!fx.secBonus){
    S.doc[S.selSec].q=cl(S.doc[S.selSec].q+fx.qualBonus,0,100);
  }
  if(fx.secPenalty==="all")SECS.forEach(s=>{S.doc[s].p=cl(S.doc[s].p-(fx.penalty||0),0,100);});
}

// ── EVENT SPAWN ─────────────────────────────────────────────────────────────
function trySpawnEvent(){
  if(S.event)return;
  let cd=S.gMin>300?65:S.gMin>240?75:90;
  if(S.gMin-S.lastEvMin<cd)return;
  let eligible=EVENTS.filter(e=>{
    if(e.minG!==undefined&&S.gMin<e.minG)return false;
    if(e.maxG!==undefined&&S.gMin>e.maxG)return false;
    let cnt=S.eCnt[e.id]||0;
    if(e.rep)return cnt<(e.maxFires||3);
    return cnt===0;
  });
  if(!eligible.length)return;
  let totalW=eligible.reduce((s,e)=>s+e.w,0);
  if(Math.random()*totalW>totalW*0.45)return;
  let r=Math.random()*totalW,acc=0,sel=eligible[eligible.length-1];
  for(let e of eligible){acc+=e.w;if(r<=acc){sel=e;break;}}
  S.event=sel;S.eCnt[sel.id]=(S.eCnt[sel.id]||0)+1;S.lastEvMin=S.gMin;
  render();
}

// ── TICK ────────────────────────────────────────────────────────────────────
function tick(){
  if(S.phase!=="home")return;
  S.gMin=Math.min(S.gMin+3,480);
  if(S.wCd>0)S.wCd=Math.max(0,S.wCd-3);
  // stress curve: 0.13 AM, 0.28 PM, 0.34 late PM (>14:00)
  let late=S.gMin>360,aft=S.gMin>240;
  S.stress=cl(S.stress+(late?0.34:aft?0.28:0.13),0,100);
  S.focus=cl(S.focus-(late?0.18:aft?0.14:0.07),0,100);
  trySpawnEvent();
  if(S.stress>=98){clearInterval(S.timerRef);S.phase="gameover";render();return;}
  if(S.gMin>=480&&!S.event){startTransit();return;}
  updateHUD();if(!S.event)updateHomePartial();
}

// ── GAME ACTIONS ────────────────────────────────────────────────────────────
function startDay(){
  S.phase="home";S.gMin=0;S.focus=80;S.stress=15;S.wCd=0;
  S.log=[];S.eCnt={};S.lastEvMin=-999;S.cigs=0;
  addLog("Den začíná. Šéfe, ty to zvládneš.","info");
  document.getElementById("pp-phase-lbl").textContent="HOME PHASE";
  S.timerRef=setInterval(tick,1000);render();
}

function workOnSection(){
  if(S.wCd>0||S.phase!=="home")return;
  let sec=S.selSec,fm=S.focus/100;
  let gain=Math.max(2,13*fm*(1-S.doc[sec].p/120));
  let qg=Math.max(1,5*fm);
  S.doc[sec].p=cl(S.doc[sec].p+gain,0,100);
  S.doc[sec].q=cl(S.doc[sec].q+qg,0,100);
  S.stress=cl(S.stress+2.5,0,100);S.focus=cl(S.focus-1.5,0,100);S.wCd=30;
  addLog(`[${SN[sec]}] +${Math.round(gain)}% progress`,"ok");
  if(S.doc[sec].p>=100)addLog(`✓ ${SN[sec]} dokončeno!`,"ok");
  render();
}

function drinkCoffee(){
  S.coffees++;
  if(S.coffees<=3){S.focus=cl(S.focus+22,0,100);S.stress=cl(S.stress-8,0,100);addLog("☕ Kafe #"+S.coffees+". Mozek se probral.","ok");}
  else if(S.coffees<=5){S.focus=cl(S.focus+5,0,100);S.stress=cl(S.stress+16,0,100);addLog("☕ Kafe #"+S.coffees+". Srdce klepe podezřele.","warn");}
  else{S.stress=cl(S.stress+22,0,100);addLog("☕ Kafe #"+S.coffees+". Čisté šílenství.","bad");}
  render();
}

function doResearch(){
  if(S.wCd>0)return;
  let sec=S.selSec;
  S.doc[sec].q=cl(S.doc[sec].q+17,0,100);S.doc[sec].p=cl(S.doc[sec].p+4,0,100);
  S.focus=cl(S.focus-6,0,100);S.wCd=45;
  addLog(`📚 Research: ${SN[sec]} quality +17`,"info");render();
}

function checkPhone(){
  S.stress=cl(S.stress+4,0,100);
  addLog("📱 Twitter. LinkedIn. Nic důležitého. (lže)","warn");
  if(!S.event&&Math.random()<0.5){
    // 50% šance na micro-distraction místo normálního eventu
    if(Math.random()<0.55){
      let d=DISTRACTIONS[Math.floor(Math.random()*DISTRACTIONS.length)];
      S.event={...d,_distraction:true};
    } else {
      let rep=EVENTS.filter(e=>e.rep&&(S.eCnt[e.id]||0)<(e.maxFires||3));
      if(rep.length){S.event=rep[Math.floor(Math.random()*rep.length)];S.eCnt[S.event.id]=(S.eCnt[S.event.id]||0)+1;}
    }
  }
  render();
}

function smokeCig(){
  S.cigs++;
  S.stress=cl(S.stress-8,0,100);
  S.focus=cl(S.focus-3,0,100);
  addLog(`🚬 Cigareta #${S.cigs}. Stres dolů. Plíce méně nadšeny.`,"warn");
  render();
}

function resolveEvent(idx){
  let o=S.event.outcomes[idx];
  applyFx(o.fx||{});addLog("→ "+o.txt,"info");
  S.event=null;render();
}

function startTransit(){
  clearInterval(S.timerRef);S.phase="transit";
  document.getElementById("pp-phase-lbl").textContent="TRANSIT";render();
}

function chooseTransit(idx){
  let tr=TRANSIT[idx];
  let roll=Math.random(),acc=0,outcome=tr.events[tr.events.length-1];
  for(let e of tr.events){acc+=e.roll;if(roll<=acc){outcome=e;break;}}
  if(outcome.fx){
    if(outcome.fx.focus!==undefined)S.focus=cl(S.focus+outcome.fx.focus,0,100);
    if(outcome.fx.stress!==undefined)S.stress=cl(S.stress+outcome.fx.stress,0,100);
    if(outcome.fx.gMin!==undefined)S.gMin=Math.min(S.gMin+outcome.fx.gMin,480);
    if(outcome.fx.qualBonus&&outcome.fx.secBonus){
      let s=outcome.fx.secBonus==="active"?S.selSec:outcome.fx.secBonus;
      if(S.doc[s])S.doc[s].q=cl(S.doc[s].q+outcome.fx.q,0,100);
    }
  }
  addLog("🚌 "+outcome.log,"info");
  S.pitch.handicap=S.stress>70?Math.round((S.stress-70)*0.4):0;
  S.pitch.allQs=[...BORIS_QS,...JANA_QS];
  S.pitch.qi=0;S.pitch.score=0;S.pitch.log=[];
  S.phase="pitch";document.getElementById("pp-phase-lbl").textContent="PITCH PHASE";render();
}

function answerPitch(idx){
  let allQs=S.pitch.allQs;
  let qi=S.pitch.qi,q=allQs[qi],a=q.ans[idx];
  let secQ=S.doc[q.sec]?S.doc[q.sec].q:50;
  let qMod=secQ/100;
  let bonus=Math.round(a.score*cl(0.45+qMod*0.8,0.45,1.2));
  S.pitch.score+=bonus;S.pitch.log.push({stk:q.stk,rxn:a.rxn,bonus});S.pitch.qi++;
  if(S.pitch.qi>=allQs.length){S.phase="result";document.getElementById("pp-phase-lbl").textContent="VÝSLEDEK";}
  render();
}

function chooseEvening(idx){
  let ch=EVENING_CHOICES[idx];
  S.evening=ch;
  addLog("🌙 Večer: "+ch.title,"info");
  // update global progression
  let sc=finalScore();
  G.totalScore+=sc;
  G.totalCoffees+=S.coffees;
  G.totalCigs+=S.cigs;
  G.dayHistory.push({day:G.day,score:sc,idea:S.idea.name,evening:ch.id});
  G.usedIdeas.push(S.idea.name);
  // relationship delta
  G.borisRel=cl(G.borisRel+(sc>=70?10:sc>=50?4:sc<40?-10:-3),0,100);
  G.janaRel=cl(G.janaRel+(sc>=70?8:sc>=50?3:sc<40?-8:-2),0,100);
  // pending fx for next day start
  G.pendingFx={focus:ch.fx.focus||0,stress:ch.fx.stress||0,docBonus:ch.docBonus||0};
  saveGame();
  S.phase="result_final";render();
}

// ── SCORE & VERDICT ─────────────────────────────────────────────────────────
function finalScore(){
  let dp=docP(),dq=docQ(),pp=S.pitch.score,h=S.pitch.handicap;
  let docPts=Math.round((dp*0.35+dq*0.65)*0.45);
  return cl(pp+docPts-h,0,100);
}

function verdict(sc){
  if(sc>=80)return{e:"🚀",t:"Boris byl překvapen — i když to nedal najevo. Jana si dělala poznámky. Termsheet přichází. Možná.",c:"#27ae60"};
  if(sc>=60)return{e:"😅",t:"Solidní pitch. Boris si tě zapamatoval jako 'ten s potenciálem'. Jana jako 'ten co potřebuje iteration'.",c:"#2980b9"};
  if(sc>=40)return{e:"🤕",t:"Přežil jsi. Prezentace nebyla katastrofa — jen nezapomenutelná ze špatných důvodů. Jana navrhla 'user testing'.",c:"#e67e22"};
  return{e:"💀",t:"Boris si sbalil věci uprostřed. Jana mu pomohla sbalit. Existuje horší feedback. Ale ne mnoho.",c:"#c0392b"};
}

// ── RENDER ───────────────────────────────────────────────────────────────────
function render(){
  let c=document.getElementById("pp-content");if(!c)return;
  document.getElementById("pp-clock").textContent=cs(S.gMin);
  let cg=document.getElementById("pp-cigs");if(cg)cg.textContent=S.cigs>0?"🚬"+S.cigs:"";
  let pd=document.getElementById("pp-day");if(pd)pd.textContent="DEN "+G.day;
  if(S.phase==="idea")c.innerHTML=renderIdea();
  else if(S.phase==="home")c.innerHTML=renderHome();
  else if(S.phase==="transit")c.innerHTML=renderTransit();
  else if(S.phase==="pitch")c.innerHTML=renderPitch();
  else if(S.phase==="result")c.innerHTML=renderResult();
  else if(S.phase==="result_final")c.innerHTML=renderResultFinal();
  else if(S.phase==="gameover")c.innerHTML=renderGameOver();
  let ov=document.querySelector(".ev-overlay");if(ov)ov.remove();
  if(S.event&&S.phase==="home"){
    let d=document.createElement("div");d.className="ev-overlay";d.innerHTML=renderEvent();
    document.getElementById("pp").appendChild(d);
  }
}

  let available=IDEAS.filter(i=>!G.usedIdeas.includes(i.name));
  if(!available.length)available=IDEAS;
  S.idea=available[Math.floor(Math.random()*available.length)];
}

// ── INIT ─────────────────────────────────────────────────────────────────────
loadGame();
let _pd=document.getElementById("pp-day");if(_pd)_pd.textContent="DEN "+G.day;
pickIdea();render();
</script>
